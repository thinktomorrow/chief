name: Jest testsuite

on: [push]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.5.1

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '23'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run jest tests
              run: pnpm test
